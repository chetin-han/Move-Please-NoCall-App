<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>무브콜 · 상태 바꾸기</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="app.css?v=2">
</head>
<body>
<div class="app dark" id="app"><div class="loading" id="msg" style="color:#fff">상태를 바꾸는 중…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js?v=2"></script>
<script>
/* 루틴(자동화)이 여는 링크: s.html?k=차주 비밀 키&st=상태 → 상태만 바꾸고 끝 */
(async () => {
  const p = new URLSearchParams(location.search), k = p.get('k'), st = p.get('st');
  const LABEL = { near: '근처에 있어요', far10: '10분 거리에 있어요', meeting: '회의 중이라 확인이 늦을 수 있어요', driving: '운전 중이라 확인이 늦어요', parked: '주차해 두었어요', none: '표시 안 함' };
  const box = document.getElementById('msg');
  const show = (icon, t, s) => box.innerHTML = `<div style="text-align:center"><div style="font-size:54px">${icon}</div><div style="font-size:20px;font-weight:800;margin-top:10px">${t}</div><div style="opacity:.7;margin-top:8px;font-size:14px">${s || ''}</div></div>`;
  if (!k || !LABEL[st]) return show('🤔', '링크가 올바르지 않아요');
  const sb = supabase.createClient(MOVECALL_CONFIG.url, MOVECALL_CONFIG.key, { auth: { persistSession: false } });
  const { data, error } = await sb.rpc('set_status_by_key', { k, st });
  if (error || data !== 'ok') return show('⚠️', '바꾸지 못했어요', error ? error.message : '차량을 찾을 수 없어요');
  show('✅', `상태: ${LABEL[st]}`, '요청자가 QR을 찍으면 이 상태가 보여요. 이 창은 닫아도 돼요.');
  setTimeout(() => { try { window.close(); } catch (e) { } }, 2500);
})();
</script>
</body>
</html>
